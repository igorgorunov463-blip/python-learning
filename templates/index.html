<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Стартап - Регистрация</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 350px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #5a6fd6;
        }
        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }
        .success { color: #28a745; }
        .error { color: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Регистрация</h2>
        <input type="text" id="name" placeholder="Ваше имя" required>
        <input type="email" id="email" placeholder="Email" required>
        <button onclick="register()">Зарегистрироваться</button>
        <div id="message"></div>
    </div>

    <script>
        async function register() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const messageDiv = document.getElementById('message');

            if (!name || !email) {
                messageDiv.className = 'error';
                messageDiv.innerText = 'Пожалуйста, заполните все поля!';
                return;
            }

            messageDiv.innerText = 'Отправка...';
            messageDiv.className = '';

            try {
                const response = await fetch('/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, email: email })
                });

                const result = await response.json();

                if (response.ok) {
                    messageDiv.className = 'success';
                    messageDiv.innerText = result.message || 'Успешно!';
                    document.getElementById('name').value = '';
                    document.getElementById('email').value = '';
                } else {
                    messageDiv.className = 'error';
                    messageDiv.innerText = result.error || 'Ошибка регистрации';
                }
            } catch (error) {
                messageDiv.className = 'error';
                messageDiv.innerText = 'Ошибка соединения с сервером';
            }
        }
    </script>
</body>
</html>
